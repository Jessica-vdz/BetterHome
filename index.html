<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">
    <!-- rest of head -->
    <link rel="stylesheet" href="./css/style.css" defer>
    <link rel="shortcut icon" href="Images/favicon.ico" type="image/x-icon">
    <script src="./js/all.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Better Home</title>
  </head>

  <body>
    <nav role="navigation">
      <div class="menuToggle">
        <input type="checkbox" class="menuCheckbox" />
        <span></span>
        <span></span>
        <span></span>
        <ul class="menu">
          <!-- 
                  We can use a label here to close upon click (when doing same page navigation), this
                  does require a slight bit of JS.
                  -->
          <li>
            <a href="./index.html">
              <label for="menuCheckbox">Home</label>
            </a>
          </li>
          <li>
            <a href="../BetterHome/pages/usage.html">Usage</a>
          </li>
          <li>
            <a href="./pages/weather.html">Weather</a>
          </li>
          <li>
            <a href="../BetterHome/pages/aboutus.html">About us</a>
          </li>
        </ul>
      </div>
    </nav>
    <section id="content">
      <header id="title">
        <h1 class="title2">Better Home</h1>
        <figure>
          <img src="./Images/Untitled-2.png" alt="logo">
        </figure>
      </header>
      <section class="boxstyle" id="date">
        <h3 id="date1"></h3>
      </section>
      <section class="boxstyle" id="grafiek">
        <canvas id="myChart" height="400rem"></canvas>
        </article>
        <aside></aside>
        <span class="graph"></span>
      </section>
      <section class="boxstyle" id="slider">
        <div class="sliderstyle">
        <h3 class="lichten">Hallway:</h3>
        <div class="slidecontainer">
          <input type="range" min="0" max="1" value="0" class="slider" id="myRange">
        </div>
        <h3 class="lichten">Bedroom:</h3>
        <div class="slidecontainer">
          <input type="range" min="0" max="1" value="0" class="slider" id="myRange1">
        </div>
        <h3 class="lichten">Livingroom:</h3>
        <div class="slidecontainer">
          <input type="range" min="0" max="1" value="0" class="slider" id="kleurslider">
        </div>
      </div>
      </section>
      <section class="tempslider" class="boxstyle">
        <div class="slider-container">
          <input type="range" id="temp-slider1" min="0" max="30" value="16">
          <span id="temp-display1">16°C</span>
          </div> <!--deze slider word aangestuurd door een api later-->
          <div class="circle-slider" style="background: conic-gradient(rgb(200,0,0)100%,rgb(0,0,0)100%);">
            <input type="range" id="temp-slider2" min="0" max="30" value="16">
            <div class="temperature-value">
              <span id="temp-display2">16°C</span>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/charts.js"></script>
   <script src="./js/slider.js" defer></script>
</html>
